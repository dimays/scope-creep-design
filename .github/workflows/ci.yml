name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: Package test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Gate (Bun)
        run: bun run test
      - name: Vitest under Node LTS (parity)
        run: node_modules/.bin/vitest run
      - name: Build
        run: bun run build
